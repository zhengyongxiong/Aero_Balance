<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <defs>
    <!-- Sky gradient: deep navy at top to sky blue at horizon -->
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1632"/>
      <stop offset="35%" stop-color="#0f1d3d"/>
      <stop offset="60%" stop-color="#1a2f5a"/>
      <stop offset="80%" stop-color="#2563a0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ground gradient: dark earth rising to misty horizon -->
    <linearGradient id="groundGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2f4a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <!-- Cloud gradient: faint translucent white -->
    <linearGradient id="cloudGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <!-- Cloud gradient 2: slightly warmer -->
    <linearGradient id="cloudGradient2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>

    <!-- Star glow filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wing tip gradient -->
    <linearGradient id="wingGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="720" height="400" fill="url(#skyGradient)"/>

  <!-- Stars - sparse, varied opacity and size -->
  <g filter="url(#starGlow)">
    <circle cx="45" cy="28" r="1.2" fill="white" opacity="0.85"/>
    <circle cx="120" cy="55" r="0.8" fill="white" opacity="0.6"/>
    <circle cx="190" cy="18" r="0.5" fill="white" opacity="0.5"/>
    <circle cx="230" cy="65" r="1.0" fill="white" opacity="0.7"/>
    <circle cx="310" cy="30" r="0.6" fill="white" opacity="0.55"/>
    <circle cx="380" cy="48" r="1.4" fill="white" opacity="0.9"/>
    <circle cx="450" cy="22" r="0.7" fill="white" opacity="0.65"/>
    <circle cx="500" cy="60" r="0.5" fill="white" opacity="0.45"/>
    <circle cx="560" cy="35" r="1.0" fill="white" opacity="0.75"/>
    <circle cx="630" cy="50" r="0.6" fill="white" opacity="0.5"/>
    <circle cx="680" cy="20" r="0.8" fill="white" opacity="0.6"/>
    <circle cx="90" cy="80" r="0.4" fill="white" opacity="0.35"/>
    <circle cx="170" cy="90" r="0.5" fill="white" opacity="0.4"/>
    <circle cx="260" cy="85" r="0.7" fill="white" opacity="0.5"/>
    <circle cx="340" cy="72" r="0.4" fill="white" opacity="0.3"/>
    <circle cx="420" cy="78" r="0.6" fill="white" opacity="0.45"/>
    <circle cx="490" cy="88" r="0.5" fill="white" opacity="0.4"/>
    <circle cx="580" cy="75" r="0.7" fill="white" opacity="0.5"/>
    <circle cx="660" cy="82" r="0.4" fill="white" opacity="0.35"/>
    <circle cx="30" cy="110" r="0.3" fill="white" opacity="0.25"/>
    <circle cx="150" cy="115" r="0.4" fill="white" opacity="0.3"/>
    <circle cx="350" cy="105" r="0.3" fill="white" opacity="0.2"/>
    <circle cx="550" cy="108" r="0.4" fill="white" opacity="0.3"/>
    <circle cx="700" cy="95" r="0.3" fill="white" opacity="0.25"/>
    <circle cx="70" cy="140" r="0.3" fill="white" opacity="0.15"/>
    <circle cx="470" cy="135" r="0.3" fill="white" opacity="0.15"/>
  </g>

  <!-- Distant cloud layer 1 - thin, wispy horizon clouds -->
  <path d="M0,195 Q60,185 120,190 Q180,178 240,185 Q300,175 360,182 Q420,170 480,178 Q540,168 600,175 Q660,165 720,172 L720,200 L0,200 Z" fill="url(#cloudGradient)" opacity="0.6"/>

  <!-- Distant cloud layer 2 - slightly thicker -->
  <path d="M0,205 Q80,195 160,200 Q240,188 320,195 Q400,183 480,190 Q560,180 640,188 Q700,178 720,182 L720,210 L0,210 Z" fill="url(#cloudGradient2)" opacity="0.5"/>

  <!-- Distant cloud wisps near horizon -->
  <path d="M80,188 Q100,183 130,186 Q150,180 170,184" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <path d="M280,178 Q310,172 340,176 Q360,170 380,174" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2"/>
  <path d="M480,172 Q510,167 540,170 Q560,165 580,169" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.3"/>
  <path d="M620,170 Q650,164 680,168" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.0"/>

  <!-- Horizon line - subtle bright transition -->
  <line x1="0" y1="198" x2="720" y2="198" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Ground / dark earth below horizon -->
  <rect x="0" y="200" width="720" height="200" fill="url(#groundGradient)"/>

  <!-- Faint ground texture - horizontal haze bands -->
  <rect x="0" y="200" width="720" height="3" fill="rgba(255,255,255,0.03)"/>
  <rect x="0" y="225" width="720" height="1.5" fill="rgba(255,255,255,0.02)"/>
  <rect x="0" y="260" width="720" height="1" fill="rgba(255,255,255,0.015)"/>
  <rect x="0" y="300" width="720" height="1" fill="rgba(255,255,255,0.01)"/>

  <!-- Wing hint - subtle leading edge left side -->
  <path d="M-20,280 L120,285 L160,290 L140,295 L-20,295 Z" fill="url(#wingGradient)" opacity="0.35"/>
  <path d="M-20,280 L120,285" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

  <!-- Wing tip glow - navigation light hint -->
  <circle cx="158" cy="289" r="1.5" fill="#ff6b6b" opacity="0.4"/>
  <circle cx="158" cy="289" r="3" fill="#ff6b6b" opacity="0.08"/>

  <!-- Nose hint - subtle forward fuselage indication -->
  <path d="M320,290 Q340,275 360,270 Q380,268 400,270 Q420,275 440,290 Z" fill="rgba(255,255,255,0.02)" opacity="0.3"/>

  <!-- Very subtle horizon glow - light spilling from below -->
  <rect x="0" y="190" width="720" height="15" fill="url(#skyGradient)" opacity="0.3"/>
</svg>